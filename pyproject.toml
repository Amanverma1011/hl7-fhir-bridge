[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hl7-fhir-bridge"
version = "0.1.0"
description = "HL7 v2 to FHIR R4 integration engine: MLLP listener, REST API and CLI"
readme = "README.md"
license = "MIT"
authors = [{ name = "Aman Verma" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
]
keywords = ["hl7", "fhir", "healthcare", "interoperability", "mllp", "integration-engine"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
hl7fhir = "hl7fhir.__main__:main"

[tool.setuptools.packages.find]
include = ["hl7fhir*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["SIM105", "SIM108"]
